<rect x="53" y="1165" width="614" height="67" rx="20" fill="#253d3b" opacity=".95"/><text id="caption" x="360" y="1208" text-anchor="middle">Oh—you're here!</text>
</svg><button id="toggle">Pause</button>
<script>
const $=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)};
window.renderAt=t=>{
 t=t%8;
 const wave=ease((t-.4)/.6)*(1-ease((t-2.6)/.7));
 const talk=t>.5&&t<6.8,energy=Math.sin(t*2.5), tilt=wave*-3+Math.sin(t*1.7)*1.3;
 $('actor').setAttribute('transform',`translate(0 ${Math.sin(t*2.4)*2})`);
 $('head').setAttribute('transform',`rotate(${tilt} 360 644)`);
 $('backHair').setAttribute('transform',`rotate(${Math.sin(t*1.7-.5)*1.2} 356 375)`);
 $('earring').setAttribute('transform',`rotate(${Math.sin(t*5)*3+tilt*-1.4} 438 526)`);
 const gaze=t<1?-4:t<4?2:Math.sin(t*1.2)*3;
 ['irisL','irisR'].forEach(id=>$(id).setAttribute('transform',`translate(${gaze} ${t<1?-2:0})`));
 let blink=1;
 for(const at of [1.25,3.6,6.4]){const d=Math.abs(t-at);if(d<.13)blink=Math.min(blink,.06+.94*d/.13)}
 const happy=ease((t-6.8)/.6);
 $('leftEye').setAttribute('transform',`translate(0 ${489*(1-blink*(1-happy*.22))}) scale(1 ${blink*(1-happy*.22)})`);
 $('rightEye').setAttribute('transform',`translate(0 ${487*(1-blink*(1-happy*.22))}) scale(1 ${blink*(1-happy*.22)})`);
 $('browL').setAttribute('transform',`translate(0 ${-wave*5-happy*3})`);
 $('browR').setAttribute('transform',`translate(0 ${-wave*8-happy*2})`);
 const syllable=talk?Math.pow(Math.max(0,Math.sin(t*17)),1.5):0;
 const open=3+syllable*16, wide=happy*5;
 $('mouth').setAttribute('d',`M${340-wide} 566 Q360 ${580+open} ${381+wide} 563 Q361 ${570+open*.35} ${340-wide} 566Z`);
 const hx=482+wave*(30+Math.sin(t*9)*7),hy=914-wave*270;
 const ex=489+wave*19,ey=803-wave*10;
 const d=`M440 739 Q${ex-5} 760 ${ex} ${ey} Q${ex+10} ${ey+34} ${hx} ${hy}`;
 $('armBorder').setAttribute('d',d);$('armSkin').setAttribute('d',d);
 $('hand').setAttribute('transform',`translate(${hx} ${hy}) rotate(${wave*(Math.sin(t*9)*12-12)+(1-wave)*170}) scale(.8)`);
 $('leaves').setAttribute('transform',`rotate(${Math.sin(t*.8)*.8} 90 1100)`);
 $('caption').textContent=t<2.8?"Oh—you're here!":t<5.6?"I was just about to call you.":"Come on, let's go!";
};
let play=true,start=performance.now();$('toggle').onclick=()=>{play=!play;$('toggle').textContent=play?'Pause':'Play';};
function animate(now){if(play&&!window.manualRender)window.renderAt((now-start)/1000);requestAnimationFrame(animate)}requestAnimationFrame(animate);window.renderAt(0);
</script></body></html>
