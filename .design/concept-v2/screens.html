<style>
*{box-sizing:border-box}html{background:#211e1a}body{margin:0;padding:34px;font-family:Arial,sans-serif;color:#f3ede4;background:#211e1a}.board-title{max-width:1660px;margin:0 auto 28px}.board-title h1{margin:0;font:400 34px Georgia,serif}.board-title p{margin:8px 0 0;color:#a79c90}.boards{max-width:1660px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}.frame{margin:0}.frame>figcaption{margin:0 0 10px;color:#cfc4b8;font-size:13px}.screen{height:540px;overflow:hidden;background:#100e0c;border:1px solid rgba(255,255,255,.1);box-shadow:0 26px 60px rgba(0,0,0,.28);position:relative;--paper:#f0e9df;--muted:#9e9387;--line:rgba(255,255,255,.09);--tile:#191612;--gold:#d9b27c;--good:#90b99d;--bad:#d97a73}.top{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font:400 16px Georgia,serif}.step,.k{color:var(--muted);font-size:8px;letter-spacing:.14em;text-transform:uppercase}.page{padding:24px}.page.tight{padding-top:18px}.title{font:400 36px/1 Georgia,serif;letter-spacing:-.025em;margin:6px 0 10px}.title.big{font-size:47px}.lead{max-width:500px;color:var(--muted);font-size:11px;line-height:1.55;margin:0}.button{display:inline-block;margin-top:19px;padding:10px 16px;border-radius:999px;background:var(--gold);color:#1a130b;font-size:10px;font-weight:700}.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;margin-top:20px}.art{min-height:285px;border-radius:18px;position:relative;overflow:hidden;background:radial-gradient(circle at 25% 25%,#8c4960,transparent 35%),radial-gradient(circle at 76% 75%,#315b69,transparent 36%),linear-gradient(140deg,#2b1921,#11191b)}.art.cricket{background:radial-gradient(circle at 25% 18%,#9b7045,transparent 31%),radial-gradient(circle at 75% 80%,#315a67,transparent 36%),linear-gradient(140deg,#2a1f14,#11191b)}.art.person{background:radial-gradient(circle at 50% 28%,#d49a6c 0 7%,transparent 8%),radial-gradient(ellipse at 50% 41%,#573228 0 15%,transparent 16%),radial-gradient(ellipse at 50% 103%,#32505a 0 39%,transparent 40%),linear-gradient(145deg,#49272a,#101719)}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.84),transparent 58%)}.art-label{position:absolute;z-index:1;left:18px;right:18px;bottom:17px}.art-label h2{font:400 28px Georgia,serif;margin:5px 0}.panel{background:var(--tile);border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:center}.panel h2{font:400 25px/1.12 Georgia,serif;margin:7px 0 10px}.verdict{font:400 23px Georgia,serif;color:var(--good);margin:8px 0}.muted{color:var(--muted);font-size:9px;line-height:1.45}.stats{display:flex;gap:26px;margin:17px 0}.num{font:400 25px Georgia,serif}.gold{color:var(--gold)}.track{height:5px;background:#312b25;border-radius:99px;overflow:hidden;margin-top:8px}.track span{display:block;height:100%;background:var(--gold)}.score{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:15px 0 5px}.score i{height:4px;background:#3c3630;border-radius:99px;overflow:hidden}.score i span{display:block;height:100%;background:#766e65}.score i:first-child span{background:var(--gold)}.score-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;color:var(--muted);font-size:6px;text-transform:uppercase}.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.tile{min-height:94px;background:var(--tile);border:1px solid var(--line);border-radius:13px;padding:13px}.tile h3{font:400 16px Georgia,serif;margin:0 0 6px}.tile.dim{opacity:.42}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:23px}.steps div{min-height:128px;background:var(--tile);padding:15px}.steps b{display:block;font:400 17px Georgia,serif;margin:11px 0 7px}.stage{font:400 31px Georgia,serif;color:#63594f}.log{margin-top:20px;border-left:1px solid var(--line)}.log div{display:grid;grid-template-columns:70px 1fr;gap:15px;padding:10px 0 10px 15px;border-bottom:1px solid var(--line);font-size:9px}.log strong{font-weight:400}.progress{height:6px;background:#332d27;border-radius:99px;overflow:hidden;margin:20px 0}.progress span{display:block;width:72%;height:100%;background:var(--gold)}.checks div{padding:8px 0;border-bottom:1px solid var(--line);font-size:9px}.check{color:var(--good);margin-right:8px}.episodes{margin-top:17px;border-top:1px solid var(--line)}.episode{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.play{width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:8px}.episode h3{font:400 14px Georgia,serif;margin:0 0 3px}.cast-hero{display:grid;grid-template-columns:.78fr 1.22fr;background:var(--tile);border-radius:18px;overflow:hidden;margin-top:18px}.cast-hero .art{min-height:280px;border-radius:0}.cast-body{padding:22px}.cast-body h2{font:400 24px/1.1 Georgia,serif;margin:7px 0}.split{margin:16px 0}.splitnums{display:flex;justify-content:space-between}.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.face{display:flex;align-items:center;gap:8px;padding:7px;border:1px solid var(--line);border-radius:10px;font-size:9px}.avatar{width:31px;height:31px;border-radius:8px;background:linear-gradient(145deg,#61485a,#21313a)}.proof{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.script{background:var(--tile);border-radius:13px;padding:15px;border-top:3px solid var(--bad)}.script.pass{border-color:var(--good)}.script blockquote{font:400 14px/1.35 Georgia,serif;margin:10px 0}.report{background:var(--tile);border-radius:13px;padding:15px;margin-top:10px}.report-head{display:flex;justify-content:space-between;align-items:center}.report h2{font:400 18px Georgia,serif;margin:0}.report-row{padding:7px 0;border-bottom:1px solid var(--line);font-size:8px}.report-row:last-child{border:0}.danger{color:var(--bad)}.good{color:var(--good)}.fold{margin-top:13px;border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:8px}.center{max-width:650px;margin:0 auto;text-align:center}.spacer{height:18px}@media(max-width:1100px){.boards{grid-template-columns:1fr}.screen{height:auto;min-height:540px}}@media print{body{background:white}.boards{display:block}.frame{page-break-after:always}.screen{height:540px}.board-title{display:none}}
</style>
</head>
<body>
<header class="board-title"><h1>CanonForge — complete UX direction</h1><p>Eleven static desktop artboards · one screen, one decision, one primary action</p></header>
<main class="boards">
<figure class="frame"><figcaption>01 · Home — explain the whole product</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">From fact to infinite story</span></header><div class="page"><div class="k">A commissioning system for story worlds</div><h1 class="title big">One true story.<br>Every character can continue it.</h1><p class="lead">Find a real event, turn it into a serial, then create side-character shows that cannot contradict the original.</p><div class="steps"><div><span class="stage">1</span><b>Find</b><span class="muted">Discover an event worth adapting.</span></div><div><span class="stage">2</span><b>Make</b><span class="muted">Write the serial and canon together.</span></div><div><span class="stage">3</span><b>Spin off</b><span class="muted">Choose an untold perspective.</span></div><div><span class="stage">4</span><b>Prove</b><span class="muted">Check it against canon.</span></div></div><span class="button">Start with a real event</span></div></section></figure>
<figure class="frame"><figcaption>02 · Scout — show the search happening</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">1 of 4 · Find a story</span></header><div class="page"><div class="k">Research-agent replay</div><h1 class="title">Watch it find the unusual.</h1><p class="lead">The scout searches for story mechanisms, not familiar headlines.</p><div class="log"><div><span class="k">Searching</span><strong>Local cases involving elaborate impersonation</strong></div><div><span class="k">Opening</span><strong>Three reports about a fake cricket league in Gujarat</strong></div><div><span class="k">Checking</span><strong>Citations opened and private identities separated</strong></div><div><span class="k">Result</span><strong>30 grounded stories ready for review</strong></div></div><span class="button">See the stories it found</span></div></section></figure>
<figure class="frame"><figcaption>03 · Sourcing — choose one event</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">1 of 4 · Choose a real event</span></header><div class="page tight"><div class="k">The scout recommends</div><div class="hero"><div class="art cricket"><div class="art-label"><span class="k">Gujarat · 2022 · grounded</span><h2>The fake IPL league</h2><span class="muted">Villagers played staged cricket for remote bettors.</span></div></div><div class="panel"><h2>A con that must become more dangerous every match.</h2><div class="verdict">Fictionalize first</div><span class="muted">The legal answer stays visible.</span><div class="score"><i><span style="width:100%"></span></i><i><span style="width:90%"></span></i><i><span style="width:80%"></span></i><i><span style="width:90%"></span></i><i><span style="width:90%"></span></i></div><div class="score-labels"><span>Engine</span><span>Hook</span><span>Feeling</span><span>Conflict</span><span>Cast</span></div><span class="button">Review this story</span></div></div><div class="shelf"><article class="tile"><h3>The court that never was</h3><span class="muted">43/50</span></article><article class="tile"><h3>The phantom examination centre</h3><span class="muted">41/50</span></article><article class="tile dim"><h3>The missing inheritance</h3><span class="danger">Blocked · still visible</span></article></div></div></section></figure>
<figure class="frame"><figcaption>04 · Brief — decide whether to commission</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">1 of 4 · Make the decision</span></header><div class="page"><div class="k">Story brief</div><h1 class="title">The Century Hitters</h1><p class="lead">A village cricketer believes he has finally been discovered. Around him, an entire fake league is staged for bettors watching from Russia.</p><div class="hero"><div class="panel"><span class="k">The story engine</span><h2>Every match needs a bigger lie while the players get better at the game they are paid to fake.</h2><div class="fold">› Read timeline, sources and scoring evidence</div></div><div class="panel"><span class="k">Clearance verdict</span><div class="verdict">Fictionalize first</div><p class="lead">Change names and combine private individuals. Publicly reported mechanics may be adapted.</p><span class="button">Commission this show</span></div></div></div></section></figure>
<figure class="frame"><figcaption>05 · Commissioning — make the wait visible</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">2 of 4 · Write the show</span></header><div class="page center"><div class="k">Commission in progress</div><h1 class="title big">The show is taking shape.</h1><p class="lead">Episodes and canon facts are written in the same pass so they cannot drift apart.</p><div class="panel" style="margin-top:25px;text-align:left"><div style="display:flex;justify-content:space-between"><h2 style="margin:0">The Century Hitters</h2><span class="muted">Episode 4 of 5</span></div><div class="progress"><span></span></div><div class="checks"><div><span class="check">✓</span>Season shape written</div><div><span class="check">✓</span>Characters established</div><div><span class="gold">●</span> Episode prose and canon beats writing together</div></div><span class="button">Open the show</span></div></div></section></figure>
<figure class="frame"><figcaption>06 · Shows — enter one story world</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">2 of 4 · Your shows</span></header><div class="page tight"><div class="k">Your catalogue</div><h1 class="title">Shows we’re making</h1><div class="hero"><div class="art cricket"><div class="art-label"><span class="k">Five episodes · canon ready</span><h2>The Century Hitters</h2><span class="muted">A fake league. Real ambition. One player who still believes.</span></div></div><div class="panel"><span class="k">Continue the journey</span><h2>The mainline is written. Its side characters are ready to become leads.</h2><span class="button">Open The Century Hitters</span></div></div><div class="shelf"><article class="tile"><h3>The Court That Never Was</h3><span class="muted">Planned</span></article><article class="tile"><h3>The Man Who Answers to a Dead Name</h3><span class="muted">Five episodes</span></article><article class="tile"><h3>The Last Signal</h3><span class="muted">Spin-off · checked</span></article></div></div></section></figure>
<figure class="frame"><figcaption>07 · Season — understand what was created</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">2 of 4 · The story world</span></header><div class="page tight"><div class="k">The Century Hitters · Season one</div><h1 class="title">The con works—until the best player stops missing.</h1><p class="lead">Five episodes establish the mainline and a structured canon of who witnessed every moment.</p><div class="episodes"><div class="episode"><span class="play">▶</span><div><h3>1. The Jersey</h3><span class="muted">Jignesh is offered ₹400 and a Chennai jersey.</span></div><span class="muted">Written</span></div><div class="episode"><span class="play">▶</span><div><h3>2. Under Halogen Lights</h3><span class="muted">The first fake match goes live.</span></div><span class="muted">Written</span></div><div class="episode"><span class="play">▶</span><div><h3>3. Two Clicks</h3><span class="muted">Bhavlo receives a new instruction.</span></div><span class="muted">Written</span></div><div class="episode"><span class="play">▶</span><div><h3>4. The Six</h3><span class="muted">Jignesh hits the shot he was meant to miss.</span></div><span class="muted">Written</span></div></div><span class="button">Explore the side characters</span></div></section></figure>
<figure class="frame"><figcaption>08 · Episode — experience one chapter</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">2 of 4 · One episode</span></header><div class="page"><div class="k">The Century Hitters · Episode 4</div><h1 class="title big">The Six</h1><p class="lead">Jignesh finally plays the shot he knows he can play. The umpire calls it a dot ball.</p><div class="hero"><div class="panel"><span class="play" style="width:48px;height:48px;font-size:13px">▶</span><h2 style="margin-top:18px">Listen to the episode</h2><span class="muted">08:42 · directed audio script</span></div><div class="panel"><span class="k">Canon moment b014</span><h2>Clean six. Dot-ball signal. Jignesh understands he is being paid to lose.</h2><div class="fold">› Read the script and beat evidence</div></div></div><span class="button">Meet the characters inside it</span></div></section></figure>
<figure class="frame"><figcaption>09 · Cast — choose one side character</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">3 of 4 · Choose a side character</span></header><div class="page tight"><div class="k">The Century Hitters · Cast</div><h1 class="title">Whose story should continue?</h1><p class="lead">What each character never knew creates room for a new show without breaking canon.</p><div class="cast-hero"><div class="art person"><div class="art-label"><h2>Jignesh</h2><span class="muted">Village batsman · nineteen</span></div></div><div class="cast-body"><span class="k">Suggested next story</span><h2>He believes he joined a tournament. He does not know the league was staged.</h2><div class="split"><div class="splitnums"><div><span class="num">4</span><div class="k">Knows</div></div><div style="text-align:right"><span class="num gold">18</span><div class="k">Blind to</div></div></div><div class="track"><span style="width:82%"></span></div></div><span class="button">Explore Jignesh’s story</span></div></div><div class="faces"><div class="face"><span class="avatar"></span>Rafiq · organiser</div><div class="face"><span class="avatar"></span>Bhavlo · umpire</div><div class="face"><span class="avatar"></span>Pankaj · landowner</div></div></div></section></figure>
<figure class="frame"><figcaption>10 · Character — decide what their show is</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">3 of 4 · Define the perspective</span></header><div class="page"><div class="hero"><div class="art person"><div class="art-label"><span class="k">The Century Hitters</span><h2>Jignesh</h2><span class="muted">The best batsman in a village that has never produced one</span></div></div><div class="panel"><h1 class="title">His story is not the heist.</h1><p class="lead">It is about a boy being paid to lose deliberately at the only thing he has ever been good at.</p><div class="split"><div class="splitnums"><div><span class="num">4</span><div class="k">Knows</div></div><div style="text-align:right"><span class="num gold">18</span><div class="k">Blind to</div></div></div><div class="track"><span style="width:82%"></span></div></div><span class="button">Create Jignesh’s spin-off</span><div class="fold">› Inspect canon constraints and writer’s brief</div></div></div></div></section></figure>
<figure class="frame"><figcaption>11 · Spin-off proof — show the claim, unfolded</figcaption><section class="screen"><header class="top"><span class="brand">CanonForge</span><span class="step">4 of 4 · Prove continuity</span></header><div class="page tight"><div class="k">Jignesh · Episode 4 · The Six</div><h1 class="title">Same moment. Two versions. Only one passes.</h1><p class="lead">Both use character Jignesh and canon beat b014. The control leaks knowledge; the constrained version stays inside what he could know.</p><div class="proof"><article class="script"><span class="k">Control · rejected</span><blockquote>“The Russian bettors would see the umpire erase his six.”</blockquote><span class="danger">Violation · Jignesh cannot know Russia exists.</span></article><article class="script pass"><span class="k">Canon-constrained · passes</span><blockquote>“It came off the middle. You saw it come off the middle.”</blockquote><span class="muted">He sees the wrong call without inventing the hidden scheme.</span></article></div><section class="report"><div class="report-head"><h2>Validator report</h2><strong class="good">Zero contradictions</strong></div><div class="report-row"><span class="check">✓</span>Knowledge leakage · none</div><div class="report-row"><span class="check">✓</span>Crossing point · beat_id b014 · “It came off the middle.”</div><div class="report-row"><span class="check">✓</span>Core canon unchanged · new beats are branch canon</div></section><span class="button">Publish the spin-off</span></div></section></figure>
